name = "cf-todo"
main = "dist/worker.mjs"
compatibility_date = "2026-05-14"

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "todo-db"
database_id = ""
# D1 读副本开关在 CF Dashboard → D1 → Settings → 读取复制（不在 wrangler.toml 里）。
# 启用后配合代码里的 env.DB.withSession('first-primary') 路由读查询到就近副本。
migrations_dir = "drizzle"

# Cron 触发器：每 4 小时执行一次 digest 提醒扫描并发送邮件（保持不变）。
[triggers]
crons = ["0 */4 * * *"]

# Durable Objects 绑定：精确提醒（与 Cron digest 并行）。
# 单实例 DO（id='reminder'），用 SQLite 后端（new_sqlite_classes 是现代推荐）。
[[durable_objects.bindings]]
name = "REMINDER_DO"
class_name = "ReminderDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReminderDO"]
