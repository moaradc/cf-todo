name = "cf-todo"
main = "dist/worker.mjs"
compatibility_date = "2026-05-14"

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "todo-db"
database_id = "af077718-dfdd-476b-8e5c-136a776a97a7"
migrations_dir = "drizzle"

# Cron 触发器：每 4 小时执行一次提醒扫描并发送邮件。
# 修改后需 `wrangler deploy` 才生效；可在 Cloudflare 控制台查看 Cron Events 历史。
[triggers]
crons = ["0 */4 * * *"]

# RESEND_API_KEY 通过 `wrangler secret put RESEND_API_KEY` 配置，不入仓库。
